name: ViralLab Safe Auto-fix

on:
  push:
    branches: [main, master]
    paths:
      - "virallab-ai/**/*.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: virallab-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virallab-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply only safe mechanical fixes
        run: |
          ruff check app.py pages src tests --fix --select F401,F541,I001
          ruff format app.py pages src tests

      - name: Verify syntax after fixes
        run: python -m compileall -q app.py pages src tests

      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            echo "No safe fixes needed."
            exit 0
          fi
          git config user.name "ViralLab Guardian"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add virallab-ai
          git commit -m "chore: apply safe Guardian auto-fixes"
          git push
