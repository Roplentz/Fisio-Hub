name: ViralLab Navigation Migration

on:
  push:
    branches:
      - fix/virallab-unblock-audit
    paths:
      - "virallab-ai/tools/migrate_navigation.py"
      - ".github/workflows/virallab-navigation-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/virallab-unblock-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic migration
        run: python virallab-ai/tools/migrate_navigation.py

      - name: Validate syntax
        run: |
          python -m py_compile virallab-ai/app.py virallab-ai/app_v3.py
          python -m py_compile virallab-ai/tests/test_app_entrypoint.py virallab-ai/tests/test_navigation_state.py

      - name: Remove one-time migration files
        run: |
          rm virallab-ai/tools/migrate_navigation.py
          rm .github/workflows/virallab-navigation-migration.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(virallab): eliminar monkey-patch de navegação"
          git push origin HEAD:fix/virallab-unblock-audit
