<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — EXECUTA AI</title><style>body{margin:0;font-family:Inter,system-ui;background:#07111f;color:#fff}.wrap{max-width:520px;margin:auto;padding:60px 20px}.card{background:#101d2f;border:1px solid #26364e;border-radius:24px;padding:30px}.muted{color:#9fb0c6;line-height:1.6}input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0 14px;border-radius:12px;border:1px solid #30415b;background:#0a1524;color:white}.btn{width:100%;border:0;background:#7657ff;color:white;padding:15px;border-radius:13px;font-weight:900}.secondary{margin-top:10px;background:#1b2a40}</style></head><body><main class="wrap"><div class="card"><h1>EXECUTA AI Pro</h1><p class="muted">Entre com seu e-mail para acessar sua memória de execução.</p><input id="email" type="email" placeholder="seu@email.com"><input id="password" type="password" placeholder="Senha"><button class="btn" id="login">Entrar</button><button class="btn secondary" id="signup">Criar conta</button><p id="msg" class="muted"></p></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg={url:'https://ndjpkfeuwpvwrkdcnjyv.supabase.co',anonKey:''};const msg=document.getElementById('msg');if(!cfg.anonKey){msg.textContent='Configuração final do Supabase Auth pendente: adicionar a chave pública anon ao frontend.';}else{const sb=createClient(cfg.url,cfg.anonKey);document.getElementById('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return msg.textContent=error.message;location.href='../app/';};document.getElementById('signup').onclick=async()=>{const {error}=await sb.auth.signUp({email:email.value,password:password.value});msg.textContent=error?error.message:'Conta criada. Verifique seu e-mail.';};}</script></body></html>
