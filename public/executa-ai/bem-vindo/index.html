<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bem-vindo ao EXECUTA AI</title><style>body{margin:0;font-family:Inter,system-ui;background:#07111f;color:#fff}.wrap{max-width:780px;margin:auto;padding:48px 20px}.card{background:#101d2f;border:1px solid #26364e;border-radius:24px;padding:30px}.muted{color:#9fb0c6;line-height:1.6}input,select{width:100%;box-sizing:border-box;margin:8px 0 18px;padding:14px;border-radius:12px;border:1px solid #30415b;background:#0a1524;color:white}.btn{border:0;background:#7657ff;color:white;padding:15px 20px;border-radius:13px;font-weight:900;width:100%}</style></head><body><main class="wrap"><div class="card"><h1>Bem-vindo ao EXECUTA AI</h1><p class="muted">Em menos de 2 minutos vamos preparar sua primeira sessão.</p><label>Seu nome</label><input id="name" placeholder="Nome"><label>Seu principal objetivo agora</label><input id="goal" placeholder="Ex.: executar projetos importantes sem adiar"><label>Quando você costuma trabalhar melhor?</label><select id="time"><option>Manhã</option><option>Tarde</option><option>Noite</option><option>Varia muito</option></select><button class="btn" id="go">Começar primeira sessão</button></div></main><script>document.getElementById('go').onclick=()=>{const profile={name:document.getElementById('name').value.trim(),goal:document.getElementById('goal').value.trim(),time:document.getElementById('time').value};localStorage.setItem('executa-onboarding',JSON.stringify(profile));location.href='../app/';};</script></body></html>
