<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXECUTA AI Pro</title><style>body{margin:0;font-family:Inter,system-ui;background:#07111f;color:#fff}.wrap{max-width:1000px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.badge{padding:7px 10px;border-radius:999px;background:#17334a;color:#8fead8;font-size:.78rem;font-weight:900}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:18px;margin-top:22px}.card{background:#101d2f;border:1px solid #26364e;border-radius:22px;padding:24px}.muted{color:#9fb0c6}.task{width:100%;box-sizing:border-box;background:#0a1524;border:1px solid #30415b;color:white;border-radius:14px;padding:15px;font:inherit}.btn{margin-top:14px;border:0;background:#7657ff;color:#fff;padding:14px 18px;border-radius:13px;font-weight:900;cursor:pointer}.metric{font-size:2rem;font-weight:900}.micro{margin-top:18px;padding:18px;border:1px solid #315a5b;border-radius:16px;background:#0d2025;display:none}.micro.show{display:block}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><div class="badge">EXECUTA AI PRO • FOUNDER 59</div><h1>O que você precisa executar agora?</h1></div><a href="../" style="color:#9fb0c6">Sair</a></div><div class="grid"><section class="card"><p class="muted">Descreva uma tarefa. Vamos reduzir até existir uma ação que você consiga começar agora.</p><textarea id="task" class="task" rows="4" placeholder="Ex.: organizar os documentos da minha progressão funcional"></textarea><label><p class="muted">Resistência: <strong id="rv">5</strong>/10</p></label><input id="r" type="range" min="0" max="10" value="5" style="width:100%"><button class="btn" id="go">Gerar microação</button><div class="micro" id="micro"><div class="badge">PRÓXIMA AÇÃO</div><h2 id="action"></h2><p class="muted" id="reason"></p></div></section><aside class="card"><h3>Execution Memory</h3><p class="muted">Sessões iniciadas</p><div class="metric" id="sessions">0</div><p class="muted">Resistência média</p><div class="metric" id="avg">—</div><p class="muted">Principal barreira</p><strong id="barrier">Ainda sem dados</strong></aside></div></main><script>const r=document.getElementById('r'),rv=document.getElementById('rv');r.oninput=()=>rv.textContent=r.value;const key='executa-pro-memory-v1';function load(){const s=JSON.parse(localStorage.getItem(key)||'[]');document.getElementById('sessions').textContent=s.length;if(s.length){document.getElementById('avg').textContent=(s.reduce((a,x)=>a+x.resistance,0)/s.length).toFixed(1)+'/10';document.getElementById('barrier').textContent=s.sort((a,b)=>b.resistance-a.resistance)[0].barrier||'Sobrecarga';}}document.getElementById('go').onclick=()=>{const t=document.getElementById('task').value.trim(),res=Number(r.value);if(!t)return alert('Descreva a tarefa.');const action=res>=8?`Abra o material de “${t}”. Não organize nada ainda. Só deixe tudo visível por 2 minutos.`:`Escolha uma única parte de “${t}” e trabalhe nela por 5 minutos.`;document.getElementById('action').textContent=action;document.getElementById('reason').textContent=res>=8?'Resistência alta: reduzimos o escopo ao menor movimento possível.':'O objetivo é iniciar, não concluir tudo agora.';document.getElementById('micro').classList.add('show');const s=JSON.parse(localStorage.getItem(key)||'[]');s.unshift({task:t,resistance:res,barrier:res>=8?'sobrecarga/aversão':'clareza/tamanho',at:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(s.slice(0,50)));load();};load();</script></body></html>
