<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EXECUTA AI — FisioHub</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <a class="back-link" href="/">← FisioHub</a>
      <span class="eyebrow">EXECUTA AI • Sprint 1.1</span>
      <h1>O que você está adiando agora?</h1>
      <p>Transforme uma tarefa travada em uma ação pequena o suficiente para começar.</p>
      <span class="status" id="ai-mode">MOTOR LOCAL</span>
    </header>

    <section class="card" id="intake-card">
      <label for="task">Tarefa</label>
      <textarea id="task" rows="3" placeholder="Ex.: reunir documentos da progressão funcional"></textarea>
      <label for="context">O que pesa quando você pensa em começar?</label>
      <textarea id="context" rows="2" placeholder="Ex.: é burocrático, trabalhoso e eu fico adiando mesmo sabendo o que fazer"></textarea>
      <div class="field-row">
        <div>
          <label for="resistance">Resistência agora: <strong id="resistance-value">5</strong>/10</label>
          <input id="resistance" type="range" min="0" max="10" value="5" />
        </div>
        <div>
          <label for="barrier">O que parece pesar mais?</label>
          <select id="barrier">
            <option value="clarity">Não sei por onde começar</option>
            <option value="size">Parece grande/trabalhoso demais</option>
            <option value="judgment">Medo de errar ou ser julgado</option>
            <option value="boredom">É chato/burocrático</option>
            <option value="energy">Estou sem energia</option>
            <option value="options">Tenho opções demais</option>
          </select>
        </div>
      </div>
      <button id="start-btn">Analisar e gerar primeira ação</button>
    </section>

    <section class="card hidden" id="question-card">
      <span class="status">UMA PERGUNTA</span>
      <h2 id="agent-question"></h2>
      <textarea id="question-answer" rows="2" placeholder="Responda em uma frase"></textarea>
      <button id="answer-btn">Continuar</button>
    </section>

    <section class="card hidden" id="action-card">
      <span class="status" id="state-badge">MICROAÇÃO</span>
      <h2 id="micro-action"></h2>
      <p id="micro-rationale"></p>
      <div class="timer" id="timer">05:00</div>
      <div class="button-row">
        <button id="begin-btn">Começar agora</button>
        <button class="secondary" id="smaller-btn">Ainda está grande</button>
        <button class="secondary hidden" id="finish-btn">Finalizar antes</button>
      </div>
    </section>

    <section class="card hidden" id="checkin-card">
      <span class="status">CHECK-IN</span>
      <h2>Você começou?</h2>
      <div class="button-row">
        <button id="done-btn">Sim</button>
        <button class="secondary" id="not-done-btn">Não</button>
      </div>
      <div id="post-checkin" class="hidden">
        <label for="resistance-after">Resistência agora: <strong id="resistance-after-value">5</strong>/10</label>
        <input id="resistance-after" type="range" min="0" max="10" value="5" />
        <textarea id="result" rows="2" placeholder="O que avançou?"></textarea>
        <button id="save-btn">Salvar sessão</button>
      </div>
    </section>

    <section class="card history-card">
      <div class="history-header"><div><span class="status">DADOS LOCAIS</span><h2>Histórico</h2></div><button class="secondary small" id="clear-btn">Limpar</button></div>
      <div id="history-empty">Nenhuma sessão registrada ainda.</div>
      <div id="history-list"></div>
    </section>
  </main>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
