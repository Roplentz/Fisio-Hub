[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virallab-ai"
version = "0.8.1"
description = "RP ViralLab Studio com engenharia reversa multimodal, importação por URL e experiência simplificada"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
ui = ["streamlit>=1.41,<2"]
semantic = ["faster-whisper>=1.1,<2"]
visual = ["opencv-python-headless>=4.10,<5", "numpy>=1.26,<3", "pytesseract>=0.3.13,<1"]
web = ["yt-dlp>=2025.6.30"]
all = ["pytest>=8", "streamlit>=1.41,<2", "faster-whisper>=1.1,<2", "opencv-python-headless>=4.10,<5", "numpy>=1.26,<3", "pytesseract>=0.3.13,<1", "yt-dlp>=2025.6.30"]

[project.scripts]
virallab = "virallab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
