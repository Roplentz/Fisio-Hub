[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virallab-ai"
version = "0.14.0"
description = "RP ViralLab Studio com inteligência editorial, engenharia reversa multimodal e produção de conteúdo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
ui = ["streamlit>=1.41,<2"]
voice = ["kokoro>=0.9.4,<1", "soundfile>=0.12,<1", "numpy>=1.26,<3"]
semantic = ["faster-whisper>=1.1,<2"]
visual = ["opencv-python-headless>=4.10,<5", "numpy>=1.26,<3", "pytesseract>=0.3.13,<1"]
web = ["yt-dlp>=2025.6.30"]
drive = ["google-api-python-client>=2.170,<3", "google-auth>=2.40,<3"]
render = ["moviepy==2.2.1", "edge-tts==7.2.7"]
all = ["pytest>=8", "streamlit>=1.41,<2", "kokoro>=0.9.4,<1", "soundfile>=0.12,<1", "faster-whisper>=1.1,<2", "opencv-python-headless>=4.10,<5", "numpy>=1.26,<3", "pytesseract>=0.3.13,<1", "yt-dlp>=2025.6.30", "google-api-python-client>=2.170,<3", "google-auth>=2.40,<3", "moviepy==2.2.1", "edge-tts==7.2.7"]

[project.scripts]
virallab = "virallab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
