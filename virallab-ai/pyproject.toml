[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virallab-ai"
version = "0.1.0"
description = "Gerador estruturado de vídeos curtos para especialistas em saúde"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
virallab = "virallab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
